name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate skill metadata and evals
        run: python scripts/validate_repository.py

      - name: Compile helper scripts
        run: python -m compileall -q scripts

      - name: Run helper tests
        run: python -m unittest discover -s scripts/tests -p "test_*.py" -v
